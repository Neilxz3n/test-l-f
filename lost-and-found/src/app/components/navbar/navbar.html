<nav class="navbar">
  <div class="navbar-container">
    <a class="navbar-brand" routerLink="/">
      <span class="brand-icon">🔍</span>
      <span class="brand-text">Lost & Found</span>
    </a>

    <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen">
      <span class="hamburger" [class.open]="mobileMenuOpen"></span>
    </button>

    <div class="navbar-links" [class.open]="mobileMenuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a routerLink="/items" routerLinkActive="active" (click)="closeMobileMenu()">
        <span class="nav-icon">📋</span> Browse Items
      </a>
      <a routerLink="/report/lost" routerLinkActive="active" class="btn-report lost" (click)="closeMobileMenu()">
        Report Lost
      </a>
      <a routerLink="/report/found" routerLinkActive="active" class="btn-report found" (click)="closeMobileMenu()">
        Report Found
      </a>
    </div>
  </div>
</nav>
